<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="civicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#civicGradient)" stroke="#ffffff" stroke-width="1"/>
  
  <!-- City buildings silhouette -->
  <rect x="4" y="18" width="3" height="8" fill="#ffffff" opacity="0.9"/>
  <rect x="8" y="15" width="3" height="11" fill="#ffffff" opacity="0.9"/>
  <rect x="12" y="12" width="3" height="14" fill="#ffffff" opacity="0.9"/>
  <rect x="16" y="16" width="3" height="10" fill="#ffffff" opacity="0.9"/>
  <rect x="20" y="14" width="3" height="12" fill="#ffffff" opacity="0.9"/>
  <rect x="24" y="17" width="3" height="9" fill="#ffffff" opacity="0.9"/>
  
  <!-- Small windows on buildings -->
  <rect x="5" y="20" width="1" height="1" fill="url(#civicGradient)" opacity="0.6"/>
  <rect x="5" y="22" width="1" height="1" fill="url(#civicGradient)" opacity="0.6"/>
  <rect x="9" y="17" width="1" height="1" fill="url(#civicGradient)" opacity="0.6"/>
  <rect x="9" y="19" width="1" height="1" fill="url(#civicGradient)" opacity="0.6"/>
  <rect x="13" y="14" width="1" height="1" fill="url(#civicGradient)" opacity="0.6"/>
  <rect x="13" y="16" width="1" height="1" fill="url(#civicGradient)" opacity="0.6"/>
  <rect x="17" y="18" width="1" height="1" fill="url(#civicGradient)" opacity="0.6"/>
  <rect x="21" y="16" width="1" height="1" fill="url(#civicGradient)" opacity="0.6"/>
  <rect x="25" y="19" width="1" height="1" fill="url(#civicGradient)" opacity="0.6"/>
  
  <!-- Report/notification icon (speech bubble) -->
  <circle cx="22" cy="10" r="4" fill="url(#accentGradient)"/>
  <path d="M20 12 L21 14 L23 12" fill="url(#accentGradient)"/>
  
  <!-- Exclamation mark in the report bubble -->
  <rect x="21.5" y="8" width="1" height="2.5" fill="#ffffff" rx="0.5"/>
  <circle cx="22" cy="11.5" r="0.5" fill="#ffffff"/>
</svg>
